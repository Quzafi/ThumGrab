<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F0F0F"/>
      <stop offset="1" stop-color="#212121"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF0000"/>
      <stop offset="1" stop-color="#CC0000"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FF0000"/>
      <stop offset="1" stop-color="#B00000"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="240" fill="#FF0000" fill-opacity="0.16"/>
  <circle cx="120" cy="600" r="220" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Eyebrow pill -->
  <rect x="90" y="80" width="404" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="116" y="114" class="sans" font-size="22" font-weight="700" letter-spacing="2" fill="#FF0000">FREE · NO SIGN-UP · NO WATERMARK</text>

  <!-- Title -->
  <text x="88" y="248" class="sans" font-size="82" font-weight="800" fill="#FFFFFF">YouTube Thumbnail</text>
  <text x="88" y="338" class="sans" font-size="82" font-weight="800" fill="#FFFFFF">Downloader</text>

  <!-- Subtitle -->
  <text x="90" y="410" class="sans" font-size="30" font-weight="500" fill="#AAAAAA">Paste any link and grab the thumbnail in HD, SD</text>
  <text x="90" y="450" class="sans" font-size="30" font-weight="500" fill="#AAAAAA">and every size — instantly, right in your browser.</text>

  <!-- Brand -->
  <g transform="translate(90 508)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#FF0000"/>
    <rect x="14" y="16" width="28" height="20" rx="5" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2.6"/>
    <path d="M28 20v9" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M24 25.5l4 4 4-4" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="38" class="sans" font-size="34" font-weight="800" fill="#FFFFFF">ThumbGrab</text>
  </g>

  <!-- Thumbnail mock -->
  <g transform="rotate(-6 940 315)">
    <rect x="748" y="196" width="384" height="238" rx="26" fill="#000000" fill-opacity="0.25"/>
    <rect x="740" y="188" width="384" height="216" rx="24" fill="url(#thumb)"/>
    <circle cx="932" cy="296" r="46" fill="#FFFFFF" fill-opacity="0.95"/>
    <path d="M920 274l30 22-30 22z" fill="#B00000"/>
    <!-- download badge -->
    <g transform="translate(1076 176)">
      <circle cx="0" cy="0" r="34" fill="#FFFFFF"/>
      <path d="M0 -14v20" stroke="#FF0000" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-9 -4l9 10 9 -10" stroke="#FF0000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-12 14h24" stroke="#FF0000" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
