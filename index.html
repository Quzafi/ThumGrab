<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="google-site-verification" content="PTxzN-63DlBer_ngmwijEOjrZSGcdHQtScyR158L_MQ" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF0000" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)" />

    <title>ThumbGrab — YouTube Thumbnail Downloader (HD & Full Quality, Free)</title>
    <meta
      name="description"
      content="Free YouTube thumbnail downloader. Paste any YouTube link and download the thumbnail in HD, SD and every resolution instantly — no signup, no watermark, works on mobile."
    />

    <!-- Fonts: Varela Round (display) + Nunito Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Varela+Round&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash: apply saved/system theme before paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>

  </body>
